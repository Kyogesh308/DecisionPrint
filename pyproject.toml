[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionprint"
version = "0.1.0"
description = "Living organizational decision memory powered by Hindsight"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["contracts*", "memory*", "ingestion*", "store*", "facade*", "intelligence*", "eval*", "ui*", "data*", "scripts*", "tests*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
