[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionprint"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["contracts*", "ui*", "data*", "scripts*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
